name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A throw-away MySQL for the tests that run with the default "dev" profile
    # (BookstoreApplicationTests). The integration tests that extend
    # AbstractIntegrationTest start their own MySQL through Testcontainers.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: bookstore
          MYSQL_USER: bookstoreUser
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # CI-only values: they exist only for this throw-away database and are not real secrets.
    # They replace the git-ignored application-secret.properties.
    env:
      MYSQL_PASSWORD: ci-only-password
      JWT_SECRET_KEY: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWJvb2tzdG9yZS1pbnRlZ3JhdGlvbi10ZXN0cy0xMjM0NTY=
      ADMIN_PASSWORD: ci-only-admin-password

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
